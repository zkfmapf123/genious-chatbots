<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chatbot</title>
<style>
  body{margin:0;font:14px system-ui,sans-serif;background:#0d1312;color:#e4ebe9;display:flex;height:100vh}
  nav{width:220px;flex-shrink:0;background:#151e1c;border-right:1px solid #2c3a37;padding:16px;overflow-y:auto}
  nav h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#95a6a0;margin:0 0 12px}
  #steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  #steps li{background:#1c2725;border:1px solid #2c3a37;border-radius:8px;padding:8px 10px}
  #steps li.pending{opacity:.6}
  #steps li .label{font-weight:700;color:#34c7b5;display:flex;justify-content:space-between;gap:8px}
  #steps li .ms{color:#95a6a0;font-weight:400;font-size:11px}
  #steps li .detail{font-size:11.5px;color:#95a6a0;white-space:pre-wrap;word-break:break-all;margin-top:2px}
  #steps li + li{margin-top:4px}
  .arrow{text-align:center;color:#56655f;font-size:12px}
  #steps:empty::before{content:"메시지를 보내면 여기에 경로가 표시됩니다";color:#56655f;font-size:12.5px}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:70%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.5}
  .user{align-self:flex-end;background:#123a35}
  .bot{align-self:flex-start;background:#1c2725}
  .usage{align-self:flex-start;font-size:11px;color:#95a6a0;padding:0 4px}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid #2c3a37}
  input{flex:1;padding:10px;border-radius:8px;border:1px solid #2c3a37;background:#151e1c;color:inherit;font:inherit}
  button{padding:10px 16px;border-radius:8px;border:none;background:#34c7b5;color:#0d1312;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<nav>
  <h2>파이프라인</h2>
  <ol id="steps"></ol>
</nav>
<main>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="메시지 입력..." autofocus>
    <button id="send">전송</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const stepsEl = document.getElementById("steps");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function addMsg(text, who) {
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // step-start(=pending, no ms yet) 카드를 만들거나, 같은 label의 pending 카드를 step(=완료)으로 갱신
  function upsertStep(label, detail, ms) {
    let li = [...stepsEl.querySelectorAll("li.pending")].find((el) => el.dataset.label === label);
    if (!li) {
      if (stepsEl.children.length > 0) {
        const a = document.createElement("div");
        a.className = "arrow";
        a.textContent = "↓";
        stepsEl.appendChild(a);
      }
      li = document.createElement("li");
      li.dataset.label = label;
      li.innerHTML = `<div class="label"><span></span><span class="ms"></span></div><div class="detail"></div>`;
      stepsEl.appendChild(li);
    }
    li.classList.toggle("pending", ms === undefined);
    li.querySelector(".label span").textContent = label;
    li.querySelector(".detail").textContent = detail ?? "";
    li.querySelector(".ms").textContent = ms === undefined ? "..." : ms + "ms";
    stepsEl.scrollTop = stepsEl.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    addMsg(message, "user");
    const pending = addMsg("...", "bot");
    stepsEl.innerHTML = "";

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) {
        const data = await res.json();
        pending.textContent = "에러: " + data.error;
        return;
      }

      // NDJSON 스트림: 파이프라인 단계가 실행되는 대로 한 줄씩 도착 -> 왼쪽 nav 실시간 갱신
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl);
          buf = buf.slice(nl + 1);
          if (!line.trim()) continue;
          const evt = JSON.parse(line);

          if (evt.type === "step-start") {
            upsertStep(evt.label, evt.detail, undefined);
          } else if (evt.type === "step") {
            upsertStep(evt.label, evt.detail, evt.ms);
          } else if (evt.type === "done") {
            pending.textContent = evt.reply;
            const u = evt.usage;
            const cost = document.createElement("div");
            cost.className = "usage";
            cost.textContent = `in ${u.inputTokens} · out ${u.outputTokens} · $${u.costUsd.toFixed(6)}`;
            log.appendChild(cost);
            log.scrollTop = log.scrollHeight;
          } else if (evt.type === "error") {
            pending.textContent = "에러: " + evt.error;
          }
        }
      }
    } catch (err) {
      pending.textContent = "에러: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
