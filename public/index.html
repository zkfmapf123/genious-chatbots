<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chatbot</title>
<style>
  body{margin:0;font:14px system-ui,sans-serif;background:#0d1312;color:#e4ebe9;display:flex;flex-direction:column;height:100vh}
  nav{flex-shrink:0;background:#151e1c;border-bottom:1px solid #2c3a37;padding:12px 16px}
  nav h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#95a6a0;margin:0 0 10px}
  #steps{list-style:none;margin:0;padding:0 0 4px;display:flex;align-items:center;gap:8px;overflow-x:auto}
  #steps li{flex-shrink:0;min-width:140px;background:#1c2725;border:1px solid #2c3a37;border-radius:8px;padding:8px 10px}
  #cfg{font-size:11.5px;color:#95a6a0;margin:-4px 0 10px;display:flex;flex-wrap:wrap;gap:4px 14px}
  #cfg b{color:#e4ebe9;font-weight:500}
  #cfg:empty{display:none}
  #steps li.pending{opacity:1;border-color:#34c7b5;box-shadow:0 0 0 2px #34c7b555;animation:glow 1s infinite}
  @keyframes glow{50%{box-shadow:0 0 0 5px #34c7b522}}
  #steps li.o-hit{border-color:#4fbe73}
  #steps li.o-fail{border-color:#f27b6f}
  #steps li .outcome:empty{display:none}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;border-radius:4px;padding:0 6px}
  #steps .badge{margin-top:3px}
  .b-hit{background:#163322;color:#4fbe73}
  .b-miss{background:#2c3a37;color:#c3cfca}
  .b-skip{background:#3a2812;color:#f0a24a}
  .b-fail{background:#3a1916;color:#f27b6f}
  .b-ok{background:#123a35;color:#34c7b5}
  #steps li .label{font-weight:700;color:#34c7b5;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
  #steps li .ms{color:#95a6a0;font-weight:400;font-size:11px}
  #steps li .detail{font-size:11.5px;color:#95a6a0;white-space:pre-wrap;word-break:break-all;margin-top:2px}
  .arrow{flex-shrink:0;min-width:20px;display:flex;align-items:center;justify-content:center;color:#56655f;font-size:14px}
  .dots{display:inline-flex;gap:3px;align-items:center}
  .dots .dot{width:4px;height:4px;border-radius:50%;background:#34c7b5;opacity:.25;animation:hop 1s infinite}
  .dots .dot:nth-child(2){animation-delay:.15s}
  .dots .dot:nth-child(3){animation-delay:.3s}
  @keyframes hop{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  #steps:empty::before{content:"메시지를 보내면 여기에 경로가 표시됩니다";color:#56655f;font-size:12.5px}
  main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:70%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.5}
  .user{align-self:flex-end;background:#123a35}
  .bot{align-self:flex-start;background:#1c2725}
  .turn{border:1px solid #2c3a37;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
  .turn:hover{border-color:#56655f}
  .turn.sel{border-color:#34c7b5}
  .tid{align-self:flex-start;display:flex;gap:8px;align-items:center;font-size:11px;color:#95a6a0;font-variant-numeric:tabular-nums}
  .usage{align-self:flex-start;font-size:11px;color:#95a6a0;padding:0 4px;white-space:pre-wrap}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid #2c3a37}
  input{flex:1;padding:10px;border-radius:8px;border:1px solid #2c3a37;background:#151e1c;color:inherit;font:inherit}
  button{padding:10px 16px;border-radius:8px;border:none;background:#34c7b5;color:#0d1312;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<nav>
  <h2>파이프라인 <button id="clear" type="button" style="float:right;padding:2px 10px;font-size:11px">대화 지우기</button></h2>
  <div id="cfg" title="서버가 지금 실제로 쓰는 설정"></div>
  <ol id="steps"></ol>
</nav>
<main>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="메시지 입력..." autofocus>
    <button id="send">전송</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const stepsEl = document.getElementById("steps");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  // 대화는 브라우저(localStorage)에 저장해서 새로고침·서버 재시작 후에도 남긴다. '대화 지우기'로만 지운다.
  // (서버의 질문·답변 기록은 /admin용이라 그대로 둔다)
  // 한 번의 질문·답변을 turn(테두리 박스)으로 묶고, 그 턴의 파이프라인 이벤트(events)도 같이 저장한다.
  // 박스를 누르면 그 턴의 파이프라인만 위 바에 다시 보여준다.
  const OUTCOME = { hit: "HIT", miss: "MISS", skip: "SKIP", fail: "FAIL", ok: "OK" };
  const KEY = "chat-turns";
  let turns = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } })();
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(turns)); } catch {}
  }
  function addEl(parent, cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }
  function showPipeline(t) {
    stepsEl.replaceChildren();
    cfgEl.replaceChildren();
    for (const e of t.events) {
      if (e.type === "config") renderCfg(e.values);
      else upsertStep(e.label, e.detail, e.ms, e.outcome);
    }
  }
  function renderHead(t, view) {
    const parts = [];
    if (t.id) parts.push(Object.assign(document.createElement("span"), { textContent: "#" + t.id }));
    if (t.cache) parts.push(Object.assign(document.createElement("span"), { className: "badge b-" + t.cache, textContent: "캐시 " + (OUTCOME[t.cache] ?? t.cache) }));
    if (t.answerMs !== undefined) parts.push(Object.assign(document.createElement("span"), { textContent: "답변까지 " + (t.answerMs / 1000).toFixed(2) + "s" }));
    view.tid.replaceChildren(...parts);
    view.tid.hidden = !parts.length;
  }
  function mkTurn(t) {
    const box = addEl(log, "turn", "");
    const tid = addEl(box, "tid", ""); // 질문·답변 고유 번호(DB chat_log.id) + 캐시 결과 + 답변까지 걸린 시간
    addEl(box, "msg user", t.q);
    const bot = addEl(box, "msg bot", t.a ?? "...");
    const usage = addEl(box, "usage", t.usage ?? "");
    if (!t.usage) usage.hidden = true;
    box.addEventListener("click", () => {
      if (send.disabled) return; // 답변 만드는 중에는 진행 표시를 건드리지 않는다
      select(box);
      showPipeline(t);
    });
    log.scrollTop = log.scrollHeight;
    const view = { box, bot, usage, tid };
    renderHead(t, view);
    return view;
  }
  function select(box) {
    log.querySelectorAll(".turn.sel").forEach((e) => e.classList.remove("sel"));
    box.classList.add("sel");
  }
  turns.forEach(mkTurn);
  log.scrollTop = log.scrollHeight;
  document.getElementById("clear").addEventListener("click", () => {
    if (send.disabled) return;
    turns = [];
    log.replaceChildren();
    stepsEl.replaceChildren();
    cfgEl.replaceChildren();
    persist();
  });

  const DOTS = '<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';

  // step-start(=pending, no ms yet) 카드를 만들거나, 같은 label의 pending 카드를 step(=완료)으로 갱신

  // 서버가 지금 쓰는 설정을 상단에 표시 (.env를 고치고 서버를 다시 띄운 뒤 반영됐는지 확인용)
  const cfgEl = document.getElementById("cfg");
  function renderCfg(v) {
    const items = [
      ["Jev", v.jevModel ?? "꺼짐"],
      ["임베딩", v.embeddingModel],
      ["캐시 임계값", v.cacheMaxDistance],
      ["캐시 TTL", v.cacheTtlHours + "h"],
      ["지식 top-K", v.kbTopK],
      ["지식 거리 제한", v.kbMaxDistance ?? "없음"],
      ["LLM", v.mainModel],
    ];
    cfgEl.replaceChildren(...items.map(([k, val]) => {
      const s = document.createElement("span");
      const b = document.createElement("b");
      b.textContent = String(val);
      s.append(k + " ", b);
      return s;
    }));
  }

  function upsertStep(label, detail, ms, outcome) {
    let li = [...stepsEl.querySelectorAll("li.pending")].find((el) => el.dataset.label === label);
    let arrow = null;
    if (!li) {
      if (stepsEl.children.length > 0) {
        arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.innerHTML = ms === undefined ? DOTS : "→"; // 다음 단계가 아직 진행중이면 화살표 자리도 점점점
        stepsEl.appendChild(arrow);
      }
      li = document.createElement("li");
      li.dataset.label = label;
      li.innerHTML = `<div class="label"><span></span><span class="ms"></span></div><div class="outcome"></div><div class="detail"></div>`;
      stepsEl.appendChild(li);
    } else {
      const prev = li.previousElementSibling;
      if (prev && prev.classList.contains("arrow")) arrow = prev;
    }
    li.classList.toggle("pending", ms === undefined);
    // HIT/MISS/SKIP/FAIL 배지: 캐시·지식 검색이 실제로 걸렸는지 한눈에 보이게
    [...li.classList].filter((c) => c.startsWith("o-")).forEach((c) => li.classList.remove(c));
    const badge = li.querySelector(".outcome");
    badge.replaceChildren();
    if (outcome) {
      li.classList.add("o-" + outcome);
      const b = document.createElement("span");
      b.className = "badge b-" + outcome;
      b.textContent = OUTCOME[outcome] ?? outcome;
      badge.append(b);
    }
    li.querySelector(".label span").textContent = label;
    li.querySelector(".detail").textContent = detail ?? "";
    li.querySelector(".ms").innerHTML = ms === undefined ? DOTS : ms + "ms";
    if (arrow && ms !== undefined) arrow.innerHTML = "→"; // 완료되면 화살표는 다시 고정
    stepsEl.scrollLeft = stepsEl.scrollWidth;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    send.disabled = true;
    const t = { q: message, a: null, usage: "", events: [] };
    turns.push(t);
    const view = mkTurn(t);
    select(view.box);
    const pending = view.bot;
    stepsEl.replaceChildren();
    cfgEl.replaceChildren();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) {
        const data = await res.json();
        pending.textContent = t.a = "에러: " + data.error;
        return;
      }

      // NDJSON 스트림: 파이프라인 단계가 실행되는 대로 한 줄씩 도착 -> 왼쪽 nav 실시간 갱신
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      // 이벤트를 도착 즉시 그리면 빠른 단계는 안 보인다. 순서대로 천천히 그려서 어느 구간을 지나는지 눈으로 따라간다.
      // 진행중 카드 PENDING_MS, 완료 카드 DONE_MS 만큼 머문다 (판단용 속도, 필요하면 값만 조절)
      const PENDING_MS = 700, DONE_MS = 500;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      let chain = Promise.resolve();
      const handle = async (evt) => {
        if (evt.type === "config") {
          t.events.push(evt);
          renderCfg(evt.values);
        } else if (evt.type === "step-start") {
          upsertStep(evt.label, evt.detail, undefined);
          await sleep(PENDING_MS);
        } else if (evt.type === "step") {
          t.events.push(evt);
          upsertStep(evt.label, evt.detail, evt.ms, evt.outcome);
          await sleep(DONE_MS);
        } else if (evt.type === "done") {
          pending.textContent = t.a = evt.reply;
          t.cache = evt.cache;
          t.answerMs = evt.answerMs;
          renderHead(t, view);
          const u = evt.usage;
          let text = evt.guided
            ? "안내 응답 (LLM·캐시 없음)"
            : evt.cached
            ? "캐시 응답 (LLM 호출 없음)"
            : `in ${u.inputTokens} · out ${u.outputTokens} · $${u.costUsd.toFixed(6)}`;
          if (evt.sources && evt.sources.length) {
            text += "\n검색된 문서: " + evt.sources.map((s) => `[${s.n}] ${s.source}#${s.chunk} (거리 ${s.distance})`).join(", ");
          }
          t.usage = view.usage.textContent = text;
          view.usage.hidden = false;
          log.scrollTop = log.scrollHeight;
        } else if (evt.type === "chat-id") {
          t.id = evt.id;
          renderHead(t, view);
        } else if (evt.type === "error") {
          pending.textContent = t.a = "에러: " + evt.error;
        }
      };
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl);
          buf = buf.slice(nl + 1);
          if (!line.trim()) continue;
          const evt = JSON.parse(line);
          chain = chain.then(() => handle(evt));
        }
      }
      await chain;
    } catch (err) {
      pending.textContent = t.a = "에러: " + err.message;
    } finally {
      t.a ??= "(응답 없음)";
      pending.textContent = t.a;
      persist();
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
